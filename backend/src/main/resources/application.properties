spring.application.name=backend

# Database connection via environment variables (no hardcoded credentials).
# Defaults below (after the colon) are for local development only.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studyapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is kept in sync incrementally so user accounts and academic data survive restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Frontend origin allowed for CORS during local development
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT signing secret (HS256, must be >= 32 bytes) and token lifetime.
# ALWAYS override JWT_SECRET via environment variable outside local dev.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}

# Document uploads (PDFs) can exceed the 1MB/10MB Spring Boot defaults.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Groq is called only from the backend. Keep the key out of frontend environment variables.
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Password reset emails (Gmail SMTP). MAIL_USERNAME must be a full Gmail address;
# MAIL_PASSWORD must be a 16-character Gmail App Password, not the account password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Origin used to build the link inside password reset emails.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
