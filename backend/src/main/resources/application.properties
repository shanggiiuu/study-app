spring.application.name=backend

# Database connection via environment variables (no hardcoded credentials).
# Defaults below are for local development only.
DB_HOST=${DB_HOST:localhost}
DB_PORT=${DB_PORT:5432}
DB_NAME=${DB_NAME:university_search}
DB_USERNAME=${DB_USERNAME:postgres}
DB_PASSWORD=${DB_PASSWORD:postgres}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dev-only: schema is dropped/recreated on every restart and reseeded from data.sql.
# Switch to "update" (and remove/guard data.sql) once you don't want the DB reset each run.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Frontend origin allowed for CORS during local development
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${SERVER_PORT:8080}
